# Base URL of the application under test
base.url=https://cloud.google.com

# Default browser timeout (milliseconds)
default.timeout=30000

# Slow-motion delay between actions (ms) – set 0 to disable
slow.motion=0

# Viewport dimensions
viewport.width=1920
viewport.height=1080
